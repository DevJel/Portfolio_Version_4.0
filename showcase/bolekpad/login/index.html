<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOLEKpad Demo Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 20% 15%,#38323a,#111318 60%);color:#f5f5f5;font:15px system-ui}.card{width:min(430px,100%);padding:36px;border:1px solid #3a3d45;border-radius:22px;background:#1b1e24;box-shadow:0 25px 80px #0008}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#ffb15b,#e66c22);display:grid;place-items:center;color:#161616;font-weight:900}h1{margin:24px 0 8px}p{color:#9ca3af;line-height:1.6}label{display:block;margin:20px 0 8px;color:#cbd0d8;font-size:13px}input{width:100%;padding:14px;border-radius:10px;border:1px solid #424752;background:#11141a;color:white;font:inherit}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#f28a36;color:#151515;font-weight:800;font:inherit;cursor:pointer}.small{font-size:12px;color:#858d99;margin-top:20px}a{color:#ffad65;text-decoration:none;font-size:13px}</style><main class="card"><div class="mark">B</div><h1>Welcome back</h1><p>Sign in to explore the BOLEKpad showcase.</p><form id="demo"><label>Email address</label><input type="email" placeholder="demo@example.com" required><label>Demo access code</label><input type="password" placeholder="Enter any demo code" required><button>Continue to demo</button></form><p class="small">Showcase simulation only. Any valid email and any code will continue. No credentials are sent, checked, or stored.</p><a href="../">← Back to project</a></main><script>document.getElementById('demo').addEventListener('submit',e=>{e.preventDefault();location.href='../dashboard/'})</script></html>
